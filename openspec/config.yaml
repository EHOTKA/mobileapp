schema: spec-driven

# Контекст проекта: только то, что нельзя вывести из кода напрямую.
context: |
  Приложение — нативная Android-аркада «Почтальон Драйв» (one-Activity, Canvas, без
  игрового движка и без WebView). Движок живёт в GameView, весь экранно-UI слой и
  персистентность — в MainActivity.

  Язык артефактов: русский текст требований, а структурные маркеры и нормативные
  ключевые слова остаются английскими — `### Requirement:`, `#### Scenario:`,
  `**WHEN**` / `**THEN**`, `SHALL` / `MUST`, `## ADDED/MODIFIED/REMOVED Requirements`.
  Валидатор требует SHALL/MUST именно в теле требования, не в заголовке.

  Сети в игре нет и добавлять её не следует: разрешения, ассеты и настройки читаются
  локально. `assets/game.html` и `assets/js/tailwind.js` — мёртвые остатки веб-прототипа,
  нативным кодом не читаются; не описывать их как часть поведения приложения.

  Поддерживаемый диапазон устройств: API 24–34. Любое поведение, зависящее от версии API
  (вибратор, WindowInsets, декодирование битмапов), обязано быть описано в спецификации
  отдельным сценарием для старых версий, а не «как на новых».

  Тестов в репозитории нет (`app/src` содержит только `main`), поэтому приёмка требований
  в задачах change-предложений формулируется как ручная проверка на устройстве/эмуляторе
  плюс сборка. Не обещать в задачах автотесты, которых в проекте не существует.

  Сборка: Gradle 9.0.0 + AGP 8.3.0, `sh gradlew assembleDebug` — рабочий entry point.
  Предупреждение «incompatible with Gradle 10» — известное отложенное, а не блокирующее.

  Игровые константы (радиусы столкновений 110/100/80, шаг спавна 0.5 с, порог скорости
  каждые 75 очков) — часть поведения, а не детали реализации: их менять можно только
  через change-предложение, потому что на них завязана кривая сложности.

  Пассивное начисление очков за дистанцию отключено СОЗНАТЕЛЬНО (ради простоты): счёт
  растёт только от доставок газет. Строка `score += (currentSpeed * dt / height * 10f)
  .toInt()` в `GameView.update()` даёт 0 из-за усечения — это ожидаемое поведение, а не
  дефект, и оформлять её «исправление» change-предложением без прямого запроса нельзя.
  Если понадобится вернуть начисление — сначала явное решение о дизайне.

rules:
  specs:
    - Писать требования по факту текущего кода, а не по желаемому поведению; расхождение оформлять change-предложением, а не «правильной» формулировкой в baseline
    - Один блок `### Requirement:` — одна проверяемая способность, без перечисления нескольких правил в одном теле
    - Для каждого требования минимум один `#### Scenario:` с полным `**WHEN**` / `**THEN**`
  proposal:
    - В `## Why` цитировать конкретную строку или формулу из кода, если причина — дефект
    - Всегда указывать, что изменение НЕ трогает, чтобы не расширять область молча
  tasks:
    - Каждый пункт — проверяемое действие; группировать реализацию и верификацию отдельно
