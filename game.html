<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мобильный почтальон: 3 Полосы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #34d399; /* Зеленая трава */
            font-family: sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
        }
        .ui-element {
            pointer-events: none;
            user-select: none;
        }
        #score-container {
            transition: transform 0.2s, background-color 0.2s;
        }
        .score-plus { background-color: #bbf7d0 !important; transform: scale(1.05); }
        .score-minus { background-color: #fecaca !important; transform: scale(0.95); }

        .back-button {
            position: absolute;
            top: 75px;
            left: 20px;
            z-index: 100;
            pointer-events: auto;
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid #3b82f6;
            border-radius: 10px;
            padding: 8px 15px;
            font-weight: bold;
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #speed-up-notif {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 900;
            color: #facc15;
            text-shadow: 4px 4px 0 #1e293b;
            pointer-events: none;
            opacity: 0;
            z-index: 60;
        }
        .animate-speed-up {
            animation: speedUpAnim 1.5s ease-out forwards;
        }
        @keyframes speedUpAnim {
            0% { opacity: 0; transform: translate(-50%, -20%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
        }
    </style>
</head>
<body>

<a href="index.html" class="back-button">← Меню</a>

<div id="game-container" class="relative w-full h-screen overflow-hidden">
    <canvas id="gameCanvas"></canvas>
    <div id="speed-up-notif">УСКОРЕНИЕ!</div>

    <!-- Верхняя панель статистики -->
    <div class="absolute top-4 left-0 w-full flex flex-col items-center gap-2 ui-element">
        <div id="score-container" class="bg-white/90 px-4 py-2 rounded-2xl shadow-lg border-2 border-green-600 flex gap-4 items-center">
            <div class="flex flex-col items-center border-r border-gray-300 pr-4">
                <span class="text-xs text-gray-500 font-bold uppercase">Очки</span>
                <span id="score" class="text-xl font-black text-green-700">0</span>
            </div>
            <div class="flex flex-col items-center border-r border-gray-300 pr-4">
                <span class="text-xs text-gray-500 font-bold uppercase">Газеты</span>
                <span id="ammo" class="text-xl font-black text-blue-600">10</span>
            </div>
            <div class="flex flex-col items-center border-r border-gray-300 pr-4">
                <span class="text-xs text-gray-500 font-bold uppercase">Жизни</span>
                <span id="lives" class="text-xl font-black text-red-500">3</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-xs text-gray-500 font-bold uppercase">Доставка</span>
                <span id="delivered" class="text-xl font-black text-orange-500">0</span>
            </div>
        </div>
    </div>

    <div id="start-screen" class="absolute inset-0 bg-black/60 flex items-center justify-center z-50 p-6">
        <div class="bg-white rounded-3xl p-8 text-center max-w-sm w-full shadow-2xl border-4 border-yellow-400">
            <h1 class="text-3xl font-black text-green-600 mb-4">3-ПОЛОСНЫЙ ДРАЙВ</h1>
            <ul class="text-left text-gray-600 mb-6 space-y-2 text-sm">
                <li>🎯 <b>Бросок</b>: Тап или Клик</li>
                <li>↔️ <b>Полосы</b>: Свайп или Стрелки</li>
                <li>📦 <b>Газеты</b>: +1 за подбор на дороге</li>
                <li>🚧 <b>Доски</b>: Объезжай (Красные) - Очки не снимаются</li>
                <li>❤️ <b>5 Доставок</b> = +1 Жизнь</li>
            </ul>
            <button id="start-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl text-xl shadow-lg active:scale-95 transition-transform pointer-events-auto">
                В ПУТЬ!
            </button>
        </div>
    </div>

    <div id="game-over-screen" class="absolute inset-0 bg-black/80 flex items-center justify-center z-50 p-6 hidden">
        <div class="bg-white rounded-3xl p-8 text-center max-w-sm w-full shadow-2xl">
            <h2 class="text-3xl font-black text-red-500 mb-2">ИГРА ОКОНЧЕНА</h2>
            <p class="text-xl mb-6">Ваш счёт: <span id="final-score" class="font-bold text-green-700">0</span></p>
            <button id="restart-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl text-xl shadow-lg active:scale-95 transition-transform pointer-events-auto">
                РЕСТАРТ
            </button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const ammoEl = document.getElementById('ammo');
    const livesEl = document.getElementById('lives');
    const deliveredEl = document.getElementById('delivered');
    const scoreContainer = document.getElementById('score-container');
    const finalScoreEl = document.getElementById('final-score');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const speedUpNotif = document.getElementById('speed-up-notif');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // Аудио (настройки сохранены)
    const throwSound = new Audio('https://www.soundjay.com/buttons_c2026/button-47.mp3');
    const failSound = new Audio('https://www.soundjay.com/buttons_c2026/beep-03.mp3');
    const successSound = new Audio('https://www.soundjay.com/buttons_c2026/button-09.mp3');
    const pickupSound = new Audio('https://www.soundjay.com/buttons_c2026/beep-22.mp3');

    throwSound.volume = 0.5;
    failSound.volume = 0.3;
    successSound.volume = 0.4;
    pickupSound.volume = 0.4;

    let gameActive = false;
    let score = 0;
    let deliveredCount = 0;
    let speed = 5;
    let pointValue = 10;
    let frameId;

    let roadWidth, roadX, laneWidth;
    let player = {
        lane: 1,
        x: 0,
        y: 0,
        targetX: 0,
        size: 25,
        ammo: 10,
        lives: 3,
        invuln: 0
    };

    let newspapers = [];
    let houses = [];
    let trees = [];
    let obstacles = [];
    let pickups = [];
    let roadMarkersY = 0;

    let touchStartX = 0;
    let touchStartY = 0;
    const swipeThreshold = 40;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        roadWidth = Math.min(canvas.width * 0.7, 400);
        roadX = (canvas.width - roadWidth) / 2;
        laneWidth = roadWidth / 3;

        player.y = canvas.height * 0.8;
        updatePlayerTargetX();
        player.x = player.targetX;
    }

    function updatePlayerTargetX() {
        player.targetX = roadX + (player.lane * laneWidth) + (laneWidth / 2);
    }

    window.addEventListener('resize', resize);
    resize();

    function updateUI() {
        scoreEl.innerText = Math.floor(score);
        ammoEl.innerText = player.ammo;
        livesEl.innerText = player.lives;
        deliveredEl.innerText = deliveredCount;
    }

    function flashUI(type) {
        const cls = type === 'plus' ? 'score-plus' : 'score-minus';
        scoreContainer.classList.add(cls);
        setTimeout(() => scoreContainer.classList.remove(cls), 200);
    }

    function showSpeedUpNotification() {
        speedUpNotif.classList.remove('animate-speed-up');
        void speedUpNotif.offsetWidth;
        speedUpNotif.classList.add('animate-speed-up');
    }

    function initGame() {
        score = 0;
        deliveredCount = 0;
        speed = 5;
        pointValue = 10;
        newspapers = [];
        houses = [];
        trees = [];
        obstacles = [];
        pickups = [];
        player.ammo = 10;
        player.lives = 3;
        player.lane = 1;
        player.invuln = 0;
        updatePlayerTargetX();
        player.x = player.targetX;
        updateUI();

        for(let i = 0; i < 6; i++) {
            trees.push({
                x: Math.random() < 0.5 ? Math.random() * (roadX - 50) : roadX + roadWidth + 20 + Math.random() * 50,
                y: Math.random() * canvas.height
            });
        }

        gameActive = true;
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        animate();
    }

    // --- УПРАВЛЕНИЕ ---
    canvas.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    });

    canvas.addEventListener('touchend', e => {
        if (!gameActive) return;
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;

        if (Math.abs(dx) > swipeThreshold && Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0 && player.lane < 2) player.lane++;
            else if (dx < 0 && player.lane > 0) player.lane--;
            updatePlayerTargetX();
        } else if (Math.abs(dy) < swipeThreshold && Math.abs(dx) < swipeThreshold) {
            const side = touchEndX < canvas.width / 2 ? -1 : 1;
            throwNewspaper(side);
        }
    });

    window.addEventListener('keydown', e => {
        if (!gameActive) return;
        if ((e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') && player.lane > 0) player.lane--;
        if ((e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') && player.lane < 2) player.lane++;
        updatePlayerTargetX();
    });

    canvas.addEventListener('mousedown', e => {
        if (!gameActive) return;
        if (e.button === 0) {
            const side = e.clientX < canvas.width / 2 ? -1 : 1;
            throwNewspaper(side);
        }
    });

    function throwNewspaper(side) {
        if (player.ammo <= 0) return;
        player.ammo--;
        updateUI();
        throwSound.currentTime = 0;
        throwSound.play().catch(() => {});
        newspapers.push({ x: player.x, y: player.y, vx: side * 12, vy: -1, delivered: false });
    }

    function spawnHouse() {
        if (Math.random() < 0.035) {
            const side = Math.random() < 0.5 ? 'left' : 'right';
            const x = side === 'left' ? roadX - 110 : roadX + roadWidth + 10;
            const lastHouse = houses[houses.length - 1];
            if (!lastHouse || lastHouse.y > 220) {
                houses.push({ x: x, y: -150, w: 100, h: 120, side: side, color: `hsl(${Math.random() * 40 + 20}, 70%, 40%)`, hit: false });
            }
        }
    }

    let roadSpawnTimer = 0;
    function manageRoadObjects() {
        roadSpawnTimer++;
        if (roadSpawnTimer > 60 / (speed / 5)) {
            roadSpawnTimer = 0;
            const lane = Math.floor(Math.random() * 3);
            const type = Math.random() < 0.3 ? 'pickup' : 'obstacle';
            const x = roadX + (lane * laneWidth) + (laneWidth / 2);

            if (type === 'obstacle') {
                obstacles.push({ x, y: -100, lane, size: 22 });
            } else {
                pickups.push({ x, y: -100, lane, size: 15 });
            }
        }
    }

    function update() {
        if (player.invuln > 0) player.invuln--;
        roadMarkersY = (roadMarkersY + speed) % 100;

        player.x += (player.targetX - player.x) * 0.25;

        spawnHouse();
        manageRoadObjects();

        // Дома
        for (let i = houses.length - 1; i >= 0; i--) {
            houses[i].y += speed;
            if (houses[i].y > canvas.height) {
                if (!houses[i].hit) {
                    score = Math.max(0, score - 5); // Штраф за пропущенный дом остается
                    flashUI('minus');
                    failSound.currentTime = 0;
                    failSound.play().catch(() => {});
                }
                houses.splice(i, 1);
            }
        }

        // Препятствия
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].y += speed;
            const dx = player.x - obstacles[i].x;
            const dy = player.y - obstacles[i].y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (player.invuln === 0 && dist < player.size + obstacles[i].size) {
                player.lives--;
                player.invuln = 60;
                flashUI('minus'); // Только визуальная вспышка и потеря жизни
                failSound.currentTime = 0;
                failSound.play().catch(() => {});
                obstacles.splice(i, 1);
                if (player.lives <= 0) endGame();
                updateUI();
                continue;
            }
            if (obstacles[i].y > canvas.height + 100) obstacles.splice(i, 1);
        }

        // Бонусы (Газеты)
        for (let i = pickups.length - 1; i >= 0; i--) {
            pickups[i].y += speed;
            const dx = player.x - pickups[i].x;
            const dy = player.y - pickups[i].y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < player.size + pickups[i].size) {
                player.ammo += 1;
                pickupSound.currentTime = 0;
                pickupSound.play().catch(() => {});
                pickups.splice(i, 1);
                updateUI();
                continue;
            }
            if (pickups[i].y > canvas.height + 100) pickups.splice(i, 1);
        }

        // Газеты в полете
        for (let i = newspapers.length - 1; i >= 0; i--) {
            let n = newspapers[i];
            n.x += n.vx;
            n.y += n.vy;
            houses.forEach(h => {
                if (!h.hit && n.x > h.x && n.x < h.x + h.w && n.y > h.y && n.y < h.y + h.h) {
                    h.hit = true;
                    n.delivered = true;
                    score += pointValue;
                    deliveredCount++;
                    flashUI('plus');
                    successSound.currentTime = 0;
                    successSound.play().catch(() => {});

                    if (deliveredCount % 5 === 0) {
                        speed *= 1.1;
                        pointValue *= 1.1;
                        player.lives++;
                        showSpeedUpNotification();
                    }
                    updateUI();
                }
            });
            if (n.x < -50 || n.x > canvas.width + 50 || n.y < -50) newspapers.splice(i, 1);
            else if (n.delivered) newspapers.splice(i, 1);
        }

        trees.forEach(t => {
            t.y += speed;
            if (t.y > canvas.height + 50) {
                t.y = -100;
                t.x = Math.random() < 0.5 ? Math.random() * (roadX - 50) : roadX + roadWidth + 20 + Math.random() * 50;
            }
        });
    }

    function endGame() {
        gameActive = false;
        finalScoreEl.innerText = Math.floor(score);
        gameOverScreen.classList.remove('hidden');
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#22c55e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#4b5563';
        ctx.fillRect(roadX, 0, roadWidth, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.setLineDash([20, 20]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(roadX + laneWidth, 0); ctx.lineTo(roadX + laneWidth, canvas.height);
        ctx.moveTo(roadX + laneWidth * 2, 0); ctx.lineTo(roadX + laneWidth * 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.setLineDash([40, 40]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, roadMarkersY - 100);
        ctx.lineTo(canvas.width / 2, canvas.height + 100);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#9ca3af';
        ctx.fillRect(roadX - 10, 0, 10, canvas.height);
        ctx.fillRect(roadX + roadWidth, 0, 10, canvas.height);

        trees.forEach(t => {
            ctx.fillStyle = '#14532d';
            ctx.beginPath(); ctx.arc(t.x, t.y, 25, 0, Math.PI * 2); ctx.fill();
        });

        houses.forEach(h => {
            ctx.fillStyle = h.color;
            ctx.fillRect(h.x, h.y, h.w, h.h);
            if (h.hit) {
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(h.x + 10, h.y + 10, h.w - 20, h.h - 20);
                ctx.font = '30px Arial';
                ctx.fillText('📩', h.x + h.w/2 - 15, h.y + h.h/2 + 10);
            }
        });

        // ПРЕПЯТСТВИЯ (Красная обводка)
        obstacles.forEach(o => {
            const w = laneWidth * 0.7;
            const h = 40;
            ctx.fillStyle = '#78350f';
            ctx.fillRect(o.x - w/2, o.y - h/2, w, h);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;
            ctx.strokeRect(o.x - w/2, o.y - h/2, w, h);
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.moveTo(o.x - w/2, o.y); ctx.lineTo(o.x + w/2, o.y);
            ctx.stroke();
        });

        // ПОДБИРАЕМЫЕ ГАЗЕТЫ (Зеленая обводка)
        pickups.forEach(p => {
            ctx.fillStyle = 'white';
            ctx.fillRect(p.x - 15, p.y - 10, 30, 20);
            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 4;
            ctx.strokeRect(p.x - 15, p.y - 10, 30, 20);
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(p.x - 10, p.y - 2, 20, 2);
        });

        newspapers.forEach(n => {
            ctx.save();
            ctx.translate(n.x, n.y);
            ctx.rotate(Date.now() * 0.02);
            ctx.fillStyle = 'white';
            ctx.fillRect(-12, -8, 24, 16);
            ctx.strokeStyle = '#94a3b8';
            ctx.strokeRect(-12, -8, 24, 16);
            ctx.restore();
        });

        // Игрок
        ctx.save();
        ctx.translate(player.x, player.y);
        if (player.invuln % 10 < 5) {
            ctx.fillStyle = '#1e293b'; ctx.fillRect(-5, -22, 10, 44);
            ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#92400e'; ctx.fillRect(-14, 12, 28, 16);
            ctx.fillStyle = '#475569'; ctx.fillRect(-18, -12, 36, 6);
        }
        ctx.restore();
    }

    function animate() {
        if (!gameActive) return;
        update();
        draw();
        frameId = requestAnimationFrame(animate);
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);
</script>
</body>
</html>
